# ==============================================================================
# Tools
# ==============================================================================

[tools]
go = "1.27.3"
air = "1.67.4" # Go live reload (used by `api`)
bun = "1.4.4"
"npm:oxfmt" = "0.76.0" # web formatter (used by `fmt`)
typst = "0.15.1"

# ==============================================================================
# Development
# ==============================================================================

[tasks.dev]
description = "Run the API and web dev servers together"
depends = ["api", "web-after-api"]

[tasks.api]
description = "Go API server with live reload via air (http://127.0.0.1:8787)"
run = "air"

[tasks.web]
description = "Vite dev server (http://localhost:5180)"
dir = "web"
run = "bun install && bun run dev"

# --- Internal helpers for `dev` -----------------------------------------------

[tasks.wait-api]
description = "Block until the API answers on 127.0.0.1:8787"
hide = true
run = "until curl -s -o /dev/null http://127.0.0.1:8787/api/settings; do sleep 0.3; done"

[tasks.web-after-api]
description = "Start the web dev server once air's first build is serving"
hide = true
depends = ["wait-api"]
run = [{ task = "web" }]

# ==============================================================================
# Build & Serve
# ==============================================================================

[tasks.build]
description = "Build the frontend into web/dist"
dir = "web"
run = "bun install && bun run build"

[tasks.cleanup]
description = "Delete generated files: build/ (release output, typst download cache), tmp/ (air), web/dist/, the docs build"
run = "rm -rf build tmp web/dist docs/.vitepress/dist docs/.vitepress/cache"

[tasks.serve]
description = "Build, then serve app + API from one process (http://127.0.0.1:8787)"
depends = ["build"]
run = "go run ./server"

[tasks.app]
description = "Build the editor, then run the desktop app: a native window (Wails, -tags desktop) reading template/ and web/dist/"
depends = ["build"]
env = { CGO_ENABLED = "1", CGO_CFLAGS = "-O2 -g -mmacosx-version-min=13.0", CGO_LDFLAGS = "-mmacosx-version-min=13.0" }
run = "go run -tags desktop ./server"

# ==============================================================================
# Quality
# ==============================================================================

[tasks.test]
description = "Server tests"
run = "go test ./server/"

[tasks.fmt]
description = "Format Go (gofmt) and web (oxfmt) sources"
run = ["go fmt ./...", "cd web && oxfmt"]

# ==============================================================================
# Docs
# ==============================================================================

[tasks.docs]
description = "VitePress dev server for the docs site (http://localhost:5173/resume-builder/)"
dir = "docs"
run = "bun install && bun run dev"

[tasks.docs-build]
description = "Build the docs site into docs/.vitepress/dist (deployed to GitHub Pages by .github/workflows/docs.yml)"
dir = "docs"
run = "bun install && bun run build"

# ==============================================================================
# Release
# ==============================================================================

[tasks.package]
description = "Build release archives (server with templates + editor bundled, plus typst) and, on macOS, the signed and notarized Resume-Builder.dmg into build/release; optional version arg"
run = "scripts/package.sh"

[tasks.release]
description = "Check the tree is clean and level with origin/main, check signing and notarization, test, package (archives + DMG), tag, publish a GitHub release (patch by default; or minor, major, X.Y.Z), and update the Homebrew cask"
run = "scripts/release.sh"

[tasks.cask]
description = "Point the Homebrew cask in dustinmichels/homebrew-tap at a release (default: the latest)"
run = "scripts/update-cask.sh"
